name: Build test and release Mac 1.0.14
on:
  push:
    paths: ['.github/workflows/publish-v114-mac.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: purrdesk-release
  cancel-in-progress: false
jobs:
  input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-v114-build-input
          run-id: 43709940347
          github-token: ${{ github.token }}
      - name: Verify unchanged build input
        run: |
          echo '14c71382d1b6f69395c0d4c08afa0c0fae79a8aedc3ae3cb2c19bdfc3efbb201  build-input.zip' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: mac-v114-build-input
          path: build-input.zip
          retention-days: 90
  mac:
    needs: input
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
            asset: Jipsa-Yeopjari-Mac-AppleSilicon.zip
            cpu: '0x100000c'
          - rid: osx-x64
            runner: macos-15-intel
            asset: Jipsa-Yeopjari-Mac-Intel.zip
            cpu: '0x1000007'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PURRDESK_TEST_ARTIFACTS: ${{ github.workspace }}/evidence/basic-artifacts
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - uses: actions/download-artifact@v4
        with:
          name: mac-v114-build-input
      - name: Extract verified source snapshot
        run: |
          python3 -m zipfile -e build-input.zip .
          mkdir -p evidence packages
          cp changes.patch RELEASE-NOTES.md evidence/
          sw_vers > evidence/build-environment.txt
          uname -m >> evidence/build-environment.txt
          dotnet --info >> evidence/build-environment.txt
      - name: Test Mac image and settings paths
        run: |
          set -o pipefail
          dotnet run --project source/PurrDesk.Mac.Checks -c Release | tee evidence/basic-checks.log
          dotnet run --project RegressionChecks -c Release | tee evidence/regression-checks.log
          cp regression-results.json evidence/
          python3 - <<'PYCODE'
          import json
          assert json.load(open('regression-results.json'))['failures']==0
          assert '34 mac checks passed.' in open('evidence/basic-checks.log').read()
          PYCODE
      - name: Build and sign native architecture bundle
        env:
          RID: ${{ matrix.rid }}
          ASSET: ${{ matrix.asset }}
          CPU: ${{ matrix.cpu }}
        run: |
          set -o pipefail
          dotnet publish source/PurrDesk.Mac/PurrDesk.Mac.csproj -c Release -r "$RID" --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish | tee evidence/publish.log
          python3 source/PurrDesk.Mac/package.py --rid "$RID" --publish publish --output packaged | tee evidence/package.log
          codesign --verify --deep --strict 'packaged/집사 옆자리.app' 2> evidence/codesign-verify.txt
          python3 source/PurrDesk.Mac/verify_bundle.py 'packaged/집사 옆자리.app' "$CPU" > evidence/bundle-verification.json
          PYTHONPATH=source/PurrDesk.Mac python3 - <<'PYCODE'
          from pathlib import Path
          from verify_bundle import verify_single_file
          import plistlib,hashlib,json
          count=verify_single_file(Path('publish/PurrDesk'),Path('packaged/집사 옆자리.app/Contents/MacOS/PurrDesk'))
          p=plistlib.loads(Path('packaged/집사 옆자리.app/Contents/Info.plist').read_bytes());assert p['CFBundleShortVersionString']=='1.0.14'
          print('Verified unchanged .NET payloads after signing:',count)
          PYCODE
          mv packaged.zip "packages/$ASSET"
          cp packaged.json evidence/package.json
      - name: Start packaged app and observe native pet windows
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('NativeWindows.swift');s=p.read_text();s=s.replace(' && ($0[kCGWindowLayer as String] as? Int) == 0','');p.write_text(s)
          p=Path('native_smoke.py');s=p.read_text();s=s.replace('windows=json.loads(check.stdout)', 'windows=json.loads(check.stdout); (out/"native-all-windows.json").write_text(json.dumps(windows,indent=2)); windows=[w for w in windows if w.get("kCGWindowBounds",{}).get("Width",0)>=100 and w.get("kCGWindowBounds",{}).get("Height",0)>=100]');p.write_text(s)
          PYCODE
          cp NativeWindows.swift native_smoke.py evidence/
          swiftc NativeWindows.swift -o native-windows
          python3 native_smoke.py 'packaged/집사 옆자리.app' evidence
      - uses: actions/upload-artifact@v4
        with:
          name: mac-v114-${{ matrix.rid }}
          path: |
            packages
            evidence
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mac-v114-failure-${{ matrix.rid }}
          path: evidence
  publish:
    needs: mac
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-v114-osx-*
          path: verified
      - name: Verify both Mac builds and preserve Windows package
        run: |
          mkdir -p packages evidence
          gh release download v1.0.13 --repo "$GITHUB_REPOSITORY" --pattern Jipsa-Yeopjari-Windows.zip --dir packages
          python3 - <<'PYCODE'
          import json,hashlib,shutil,gzip,base64
          from pathlib import Path
          root=Path('verified');summaries=[]
          for rid,asset in [('osx-arm64','Jipsa-Yeopjari-Mac-AppleSilicon.zip'),('osx-x64','Jipsa-Yeopjari-Mac-Intel.zip')]:
              d=root/('mac-v114-'+rid);r=json.loads((d/'evidence/regression-results.json').read_text());assert r['failures']==0
              n=json.loads((d/'evidence/native-smoke.json').read_text());assert n['native_app_started'] and n['visible_pet_windows']>=2
              assert n['cpu']==('arm64' if rid=='osx-arm64' else 'x86_64')
              summaries.append({'rid':rid,'regression_checks':len(r['results']),'native':n})
              shutil.copyfile(d/'packages'/asset,Path('packages')/asset)
              shutil.copytree(d/'evidence',Path('evidence')/rid)
          windows=Path('packages/Jipsa-Yeopjari-Windows.zip');assert hashlib.sha256(windows.read_bytes()).hexdigest()=='482150b36c25e2b01f481a4f58606f6d3f32a233168fea4ea3ea59560ed8cd15'
          m={'tag':'v1.0.14','windows_version':'1.0.13 (unchanged)','mac_version':'1.0.14','files':[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(Path('packages').glob('*.zip'))]}
          Path('packages/release-manifest.json').write_text(json.dumps(m,indent=2))
          Path('packages/SHA256SUMS.txt').write_text(''.join(f["sha256"]+'  '+f['name']+chr(10) for f in m['files']))
          Path('evidence/mac-validation.json').write_text(json.dumps({'passed':True,'builds':summaries},indent=2))
          shutil.copyfile(root/'mac-v114-osx-arm64/evidence/RELEASE-NOTES.md','RELEASE-NOTES.md')
          Path('publish_verified.py').write_bytes(gzip.decompress(base64.b64decode('')))
          shutil.copyfile('packages/release-manifest.json','evidence/release-manifest.json')
          PYCODE
          python3 publish_verified.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-v114-evidence
          path: evidence
          retention-days: 90
