{
  "name": "Validate Store update 1.0.18 from released Windows binaries",
  "on": {
    "push": {
      "paths": [
        ".github/workflows/store-v118-update.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "validate": {
      "runs-on": "windows-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "store-v113-validation",
            "run-id": 43699245732,
            "github-token": "${{ github.token }}",
            "path": "baseline"
          }
        },
        {
          "name": "Package identical release binaries and run WACK and installed launch",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\n$out = Join-Path $env:GITHUB_WORKSPACE 'store-output'\nNew-Item -ItemType Directory -Force $out | Out-Null\nStart-Transcript (Join-Path $out 'validation-transcript.txt')\n$identity = 'Chaapssal-Nooroongghi.10202156D8DE9'\n$publisher = 'CN=DE7DDEC8-9C61-4EC5-BFE6-81123A68DFC1'\n$expectedZip = '12c7b349111a12d4fc2e35a93662a39e51e0dbb7b988c2eccad272c21a2d191d'\n$expectedOld = 'e475966fb2655a2d327260c7c556b63b01c134863683065e27d702a5e91888d0'\n$cert = $null; $trusted = $null; $msix = $null; $originalHash = $null\ntry {\n  Invoke-WebRequest 'https://github.com/chaapssal-nooroonghi/PurrDesk/releases/download/v1.0.18/Jipsa-Yeopjari-Windows.zip' -OutFile portable.zip\n  if ((Get-FileHash portable.zip).Hash.ToLowerInvariant() -ne $expectedZip) { throw 'Released Windows ZIP hash mismatch' }\n  Expand-Archive portable.zip portable\n  $old = (Get-ChildItem baseline -Recurse -Filter Jipsa-Yeopjari-1.0.13.0-Store.msix).FullName\n  if (@($old).Count -ne 1 -or (Get-FileHash $old).Hash.ToLowerInvariant() -ne $expectedOld) { throw 'Store baseline mismatch' }\n  $oldLayout = Join-Path $env:RUNNER_TEMP 'store-baseline'\n  [IO.Compression.ZipFile]::ExtractToDirectory($old, $oldLayout)\n  $layout = Join-Path $env:RUNNER_TEMP 'store-layout'\n  Copy-Item portable/data $layout -Recurse\n  # Use the released real application, not its portable launcher. Only filenames change.\n  Rename-Item \"$layout/집사 옆자리.exe\" PurrDesk.exe\n  Rename-Item \"$layout/집사 옆자리.exe.config\" PurrDesk.exe.config\n  foreach ($name in @('README.md','시작하기.txt')) { Remove-Item -LiteralPath (Join-Path $layout $name) }\n  Copy-Item \"$oldLayout/Assets\" \"$layout/Assets\" -Recurse\n  [xml]$manifest = Get-Content \"$oldLayout/AppxManifest.xml\" -Raw -Encoding UTF8\n  if ($manifest.Package.Identity.Name -ne $identity -or $manifest.Package.Identity.Publisher -ne $publisher) { throw 'Identity mismatch' }\n  if ($manifest.Package.Applications.Application.Executable -ne 'PurrDesk.exe') { throw 'Unexpected application entry point' }\n  $manifest.Package.Identity.Version = '1.0.18.0'\n  $manifest.Save(\"$layout/AppxManifest.xml\")\n  $payload = @()\n  foreach ($f in Get-ChildItem portable/data -Recurse -File) {\n    $relative = [IO.Path]::GetRelativePath((Resolve-Path portable/data), $f.FullName)\n    if ($relative -in @('README.md','시작하기.txt')) { continue }\n    $target = $relative.Replace('집사 옆자리.exe','PurrDesk.exe')\n    $hash = (Get-FileHash $f.FullName).Hash.ToLowerInvariant()\n    if ((Get-FileHash (Join-Path $layout $target)).Hash.ToLowerInvariant() -ne $hash) { throw \"Payload changed: $relative\" }\n    $payload += [pscustomobject]@{release_path=$relative;store_path=$target;sha256=$hash}\n  }\n  $payload | ConvertTo-Json | Set-Content \"$out/payload-provenance.json\"\n  if ((Get-FileHash \"$layout/models/u2netp.onnx\").Hash -ne (Get-FileHash \"$oldLayout/models/u2netp.onnx\").Hash) { throw 'ONNX model unexpectedly changed' }\n  $version = (Get-Item \"$layout/PurrDesk.exe\").VersionInfo.FileVersion\n  if ($version -ne '1.0.18.0') { throw \"Unexpected EXE version: $version\" }\n  $kits = \"${env:ProgramFiles(x86)}/Windows Kits/10\"\n  $make = (Get-ChildItem \"$kits/bin/*/x64/makeappx.exe\" | Sort-Object FullName -Descending | Select-Object -First 1).FullName\n  $msix = Join-Path $out 'Jipsa-Yeopjari-1.0.18.0-Store.msix'\n  & $make pack /o /h SHA256 /d $layout /p $msix\n  if ($LASTEXITCODE -ne 0) { throw 'MakeAppx validation failed' }\n  & $make unpack /o /p $msix /d \"$env:RUNNER_TEMP/roundtrip\"\n  if ($LASTEXITCODE -ne 0) { throw 'MakeAppx unpack failed' }\n  foreach ($f in Get-ChildItem $layout -Recurse -File) {\n    $relative = [IO.Path]::GetRelativePath($layout,$f.FullName)\n    if ((Get-FileHash $f.FullName).Hash -ne (Get-FileHash (Join-Path \"$env:RUNNER_TEMP/roundtrip\" $relative)).Hash) { throw \"Roundtrip changed $relative\" }\n  }\n  $originalHash = (Get-FileHash $msix).Hash.ToLowerInvariant()\n  @{version='1.0.18.0';identity=$identity;publisher=$publisher;sha256=$originalHash;release_zip_sha256=$expectedZip;baseline_msix_sha256=$expectedOld;source_release='v1.0.18';application_bytes_unchanged=$true;payload_files=$payload.Count;unsigned=$true;roundtrip_verified=$true} | ConvertTo-Json | Set-Content \"$out/package-verification.json\"\n  Copy-Item \"$layout/AppxManifest.xml\" \"$out/AppxManifest.xml\"\n  $wack = Join-Path $kits 'App Certification Kit/appcert.exe'\n  if (!(Test-Path $wack)) {\n    $sdk = Join-Path $env:RUNNER_TEMP 'sdk.exe'\n    Invoke-WebRequest 'https://download.microsoft.com/download/e6cfffdc-0d3e-4c6c-96d7-d491da459a07/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $sdk\n    $sig = Get-AuthenticodeSignature $sdk\n    if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'SDK signature invalid' }\n    $p = Start-Process $sdk -ArgumentList '/quiet','/norestart','/features','OptionId.WindowsSoftwareLogoToolkit' -PassThru\n    if (!$p.WaitForExit(600000)) { throw 'SDK installation timeout' }\n  }\n  (Get-Item $wack).VersionInfo | Format-List | Out-File \"$out/wack-version.txt\"\n  $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $publisher -CertStoreLocation Cert:\\CurrentUser\\My -NotAfter (Get-Date).AddDays(1)\n  $cer = \"$env:RUNNER_TEMP/test.cer\"\n  Export-Certificate -Cert $cert -FilePath $cer | Out-Null\n  $trusted = Import-Certificate -FilePath $cer -CertStoreLocation Cert:\\LocalMachine\\TrustedPeople\n  $signed = \"$env:RUNNER_TEMP/test-only.msix\"\n  Copy-Item $msix $signed\n  $sign = (Get-ChildItem \"$kits/bin/*/x64/signtool.exe\" | Sort-Object FullName -Descending | Select-Object -First 1).FullName\n  & $sign sign /fd SHA256 /sha1 $cert.Thumbprint $signed\n  if ($LASTEXITCODE -ne 0) { throw 'Test signing failed' }\n  & $wack reset\n  $p = Start-Process $wack -ArgumentList 'test','-appxpackagepath',$signed,'-reportoutputpath',\"$out/wack-report.xml\" -PassThru -RedirectStandardOutput \"$out/wack-stdout.txt\" -RedirectStandardError \"$out/wack-stderr.txt\"\n  if (!$p.WaitForExit(600000)) { throw 'WACK timeout' }\n  [xml]$report = Get-Content \"$out/wack-report.xml\" -Raw\n  $results = @($report.SelectNodes('//TEST') | ForEach-Object { [pscustomobject]@{Id=$_.GetAttribute('INDEX');Name=$_.GetAttribute('NAME');Result=$_.SelectSingleNode('RESULT').InnerText} })\n  $results | ConvertTo-Json | Set-Content \"$out/wack-tests.json\"\n  $overall = $report.DocumentElement.GetAttribute('OVERALL_RESULT')\n  @{overall=$overall;partial=$report.DocumentElement.GetAttribute('PARTIAL_RUN');tests=$results.Count;pass=@($results|Where-Object Result -eq 'PASS').Count;fail=@($results|Where-Object Result -eq 'FAIL').Count;warning=@($results|Where-Object Result -eq 'WARNING').Count;exit_code=$p.ExitCode} | ConvertTo-Json | Set-Content \"$out/wack-summary.json\"\n  if ($results.Count -ne 24 -or @($results|Where-Object Result -ne 'PASS').Count -ne 0 -or $overall -ne 'PASS') { throw 'WACK did not pass all 24 tests' }\n  Add-AppxPackage -Path $signed\n  $package = Get-AppxPackage -Name $identity\n  if ($package.Version -ne '1.0.18.0') { throw 'Installed version mismatch' }\n  $package | Select-Object Name,Version,PackageFullName,PackageFamilyName,InstallLocation,Status | ConvertTo-Json | Set-Content \"$out/installed-package.json\"\n  Start-Process explorer.exe -ArgumentList ('shell:AppsFolder\\'+$package.PackageFamilyName+'!PurrDesk')\n  Start-Sleep -Seconds 8\n  $app = @(Get-Process PurrDesk -ErrorAction SilentlyContinue)\n  if ($app.Count -ne 1) { throw 'Packaged app did not stay alive as one instance' }\n  Add-Type -TypeDefinition @'\nusing System;using System.Runtime.InteropServices;using System.Collections.Generic;\npublic static class WindowCheck {\n delegate bool EnumProc(IntPtr h,IntPtr p);\n [DllImport(\"user32.dll\")] static extern bool EnumWindows(EnumProc cb,IntPtr p);\n [DllImport(\"user32.dll\")] static extern uint GetWindowThreadProcessId(IntPtr h,out uint pid);\n [DllImport(\"user32.dll\")] static extern bool IsWindowVisible(IntPtr h);\n [DllImport(\"user32.dll\")] static extern IntPtr GetWindowDpiAwarenessContext(IntPtr h);\n [DllImport(\"user32.dll\")] static extern bool AreDpiAwarenessContextsEqual(IntPtr a,IntPtr b);\n public static string[] Check(uint pid) {var r=new List<string>();EnumWindows((h,p)=>{uint id;GetWindowThreadProcessId(h,out id);if(id==pid&&IsWindowVisible(h))r.Add(\"HWND=\"+h+\";PerMonitorV2=\"+AreDpiAwarenessContextsEqual(GetWindowDpiAwarenessContext(h),new IntPtr(-4)));return true;},IntPtr.Zero);return r.ToArray();}\n}\n'@\n  $windows = @([WindowCheck]::Check($app[0].Id))\n  $windows | Set-Content \"$out/packaged-window-dpi.txt\"\n  if ($windows.Count -lt 2 -or @($windows|Where-Object {$_ -notmatch 'PerMonitorV2=True'}).Count) { throw 'Expected two visible PerMonitorV2 windows' }\n  Add-Type -AssemblyName System.Windows.Forms,System.Drawing\n  $bounds = [Windows.Forms.SystemInformation]::VirtualScreen\n  $bmp = [Drawing.Bitmap]::new($bounds.Width,$bounds.Height)\n  $g = [Drawing.Graphics]::FromImage($bmp)\n  try {$g.CopyFromScreen($bounds.Left,$bounds.Top,0,0,$bmp.Size);$bmp.Save(\"$out/installed-app.png\",[Drawing.Imaging.ImageFormat]::Png)} finally {$g.Dispose();$bmp.Dispose()}\n  $data = Join-Path $env:LOCALAPPDATA ('Packages/'+$package.PackageFamilyName+'/LocalCache/Local/CatDesk')\n  if (!(Test-Path \"$data/settings.json\")) { throw 'Packaged settings not saved at expected data location' }\n  $settingsBefore = (Get-FileHash \"$data/settings.json\").Hash\n  Copy-Item \"$data/settings.json\" \"$out/settings-first-launch.json\"\n  $app | Stop-Process -Force\n  Start-Process explorer.exe -ArgumentList ('shell:AppsFolder\\'+$package.PackageFamilyName+'!PurrDesk')\n  Start-Sleep -Seconds 5\n  if (!(Get-Process PurrDesk -ErrorAction SilentlyContinue)) { throw 'Packaged restart failed' }\n  $settingsAfter = (Get-FileHash \"$data/settings.json\").Hash\n  Copy-Item \"$data/settings.json\" \"$out/settings-after-restart.json\"\n  if ($settingsBefore -ne $settingsAfter) { throw 'Settings changed unexpectedly on restart' }\n  @{installed=$true;aumid_launch=$true;visible_windows=$windows.Count;window_pm_v2=$true;restart=$true;settings_unchanged_on_restart=$true;startup_manifest_preserved=$true;relogin_startup_tested=$false;actual_scale_transitions_tested=$false;environment='GitHub hosted Windows runner'} | ConvertTo-Json | Set-Content \"$out/runtime.json\"\n  'PASS' | Set-Content \"$out/validation-status.txt\"\n} finally {\n  Get-Process PurrDesk -ErrorAction SilentlyContinue | Stop-Process -Force\n  Get-AppxPackage -Name $identity | Remove-AppxPackage\n  if ($trusted) {Remove-Item (\"Cert:\\LocalMachine\\TrustedPeople\\\"+$trusted.Thumbprint)}\n  if ($cert) {Remove-Item (\"Cert:\\CurrentUser\\My\\\"+$cert.Thumbprint) -DeleteKey}\n  if ($originalHash -and (Get-FileHash $msix).Hash.ToLowerInvariant() -ne $originalHash) {throw 'Unsigned Store original changed'}\n  @{temporary_app_removed=(!(Get-AppxPackage -Name $identity));test_certificate_removed=$true;store_original_unchanged=([bool]$originalHash);cloud_pc_subscription_untouched=$true} | ConvertTo-Json | Set-Content \"$out/cleanup.json\"\n  Stop-Transcript\n}\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "store-v118-update-validation",
            "path": "store-output",
            "retention-days": 30
          }
        }
      ]
    }
  }
}