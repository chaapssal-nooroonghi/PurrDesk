name: Compare live DPI synchronization candidate
on:
  push:
    paths: ['.github/workflows/dpi-transition-compare.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-latest
    steps:
      - name: Reproduce stale DPI and compare production forms
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory output | Out-Null
          gh api repos/chaapssal-nooroonghi/PurrDesk/actions/artifacts/14140141032/zip > original.zip
          if($LASTEXITCODE -ne 0){throw 'Download failed'}
          Expand-Archive original.zip original
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path original/Jipsa-Yeopjari-1.0.8.0-Store.msix), "$pwd/baseline")
          Copy-Item baseline candidate -Recurse
          [IO.File]::WriteAllBytes("$pwd/baseline/TransitionChecks.exe",[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes("$pwd/baseline/TransitionChecks.exe.config",[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes("$pwd/candidate/TransitionChecks.exe",[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes("$pwd/candidate/TransitionChecks.exe.config",[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes("$pwd/candidate/PurrDesk.exe",[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes("$pwd/candidate/PurrDesk.exe.config",[Convert]::FromBase64String(''))
          & ./baseline/TransitionChecks.exe "$pwd/output/baseline" | Tee-Object output/baseline-console.txt
          $before=$LASTEXITCODE
          & ./candidate/TransitionChecks.exe "$pwd/output/candidate" | Tee-Object output/candidate-console.txt
          $after=$LASTEXITCODE
          @{baseline_exit=$before;candidate_exit=$after;actual_monitor_switch=$false} | ConvertTo-Json | Set-Content output/comparison.json
          if($before -eq 0){throw 'Regression was not reproduced in baseline'}
          if($after -ne 0){throw 'Candidate regression checks failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dpi-transition-comparison
          path: output
          retention-days: 14
