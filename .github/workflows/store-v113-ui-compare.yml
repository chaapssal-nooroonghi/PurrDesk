name: Compare DPI layout and pet-size independence
on:
  push:
    paths: ['.github/workflows/store-v113-ui-compare.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Compare real WinForms behavior with managed DPI fixtures
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          function Write-CompressedFile($path, $encoded) {
            $inputStream=[IO.MemoryStream]::new([Convert]::FromBase64String($encoded))
            $decompress=[IO.Compression.GZipStream]::new($inputStream,[IO.Compression.CompressionMode]::Decompress)
            $outputStream=[IO.MemoryStream]::new()
            try { $decompress.CopyTo($outputStream); [IO.File]::WriteAllBytes($path,$outputStream.ToArray()) }
            finally { $outputStream.Dispose(); $decompress.Dispose(); $inputStream.Dispose() }
          }
          gh api repos/chaapssal-nooroonghi/PurrDesk/actions/artifacts/14152048671/zip > original.zip
          if($LASTEXITCODE -ne 0){throw 'Download failed'}
          Expand-Archive original.zip original
          $original=(Get-ChildItem original -Recurse -Filter Jipsa-Yeopjari-1.0.12.0-Store.msix).FullName
          if((Get-FileHash $original).Hash.ToLowerInvariant() -ne 'aa8812f3ab208e49bd421ca5c5ba4accb73ef0dc8060f192965480c6a3492b8c'){throw 'Wrong original'}
          [IO.Compression.ZipFile]::ExtractToDirectory($original,"$pwd/baseline")
          Copy-Item baseline candidate -Recurse
          New-Item -Type Directory output | Out-Null
          Write-CompressedFile "$pwd/baseline/LayoutChecks.exe" ''
          Write-CompressedFile "$pwd/baseline/LayoutChecks.exe.config" ''
          Write-CompressedFile "$pwd/candidate/LayoutChecks.exe" ''
          Write-CompressedFile "$pwd/candidate/LayoutChecks.exe.config" ''
          Write-CompressedFile "$pwd/candidate/PurrDesk.exe" ''
          Write-CompressedFile "$pwd/candidate/PurrDesk.exe.config" ''
          & ./baseline/LayoutChecks.exe "$pwd/output/baseline" | Tee-Object output/baseline-console.txt
          $before=$LASTEXITCODE
          & ./candidate/LayoutChecks.exe "$pwd/output/candidate" | Tee-Object output/candidate-console.txt
          $after=$LASTEXITCODE
          @{baseline_exit=$before;candidate_exit=$after;actual_monitor_switch=$false;test_only_stale_bounds_fixture=$true} | ConvertTo-Json | Set-Content output/comparison.json
          if($before -eq 0){throw 'No baseline failures detected'}
          if(!(Test-Path output/baseline/layout-checks.txt) -or (Select-String '^ERROR ' output/baseline/layout-checks.txt)){throw 'Baseline fixture failed'}
          if($after -ne 0){throw 'Candidate behavior checks failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-v113-ui-comparison
          path: output
          retention-days: 14
