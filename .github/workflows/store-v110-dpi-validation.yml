name: Build and validate Store 1.0.10 font DPI fix
on:
  push:
    paths: ['.github/workflows/store-v110-dpi-validation.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Pack, certify, install and test all settings tabs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'candidate-output';New-Item -ItemType Directory $out | Out-Null
          $layout=Join-Path $env:RUNNER_TEMP 'candidate-layout'
          $cert=$null;$trusted=$null;$original=$null
          try {
           gh api repos/chaapssal-nooroonghi/PurrDesk/actions/artifacts/14147115169/zip > original.zip
           if($LASTEXITCODE -ne 0){throw 'Download failed'}
           Expand-Archive original.zip original
           $original=(Get-ChildItem original -Recurse -Filter Jipsa-Yeopjari-1.0.9.0-Store.msix | Select-Object -First 1).FullName
           if((Get-FileHash $original).Hash.ToLowerInvariant() -ne '1d0b3d7839993a8da2df0fd1114785f91e0343f434946e01f31ee1d3a92549ee'){throw 'Original hash mismatch'}
           [IO.Compression.ZipFile]::ExtractToDirectory($original,$layout)
           foreach($name in @('AppxBlockMap.xml','[Content_Types].xml','AppxSignature.p7x')){ $path=Join-Path $layout $name;if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path} }
           # The following files are the freshly compiled 1.0.10 candidate, not a patched WACK analyzer.
           [IO.File]::WriteAllBytes("$layout/PurrDesk.exe",[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes("$layout/PurrDesk.exe.config",[Convert]::FromBase64String(''))
           [xml]$manifest=Get-Content "$layout/AppxManifest.xml" -Raw -Encoding UTF8
           $manifest.Package.Identity.Version='1.0.10.0';$manifest.Save("$layout/AppxManifest.xml")
           $kits="${env:ProgramFiles(x86)}\Windows Kits\10"
           $make=(Get-ChildItem "$kits/bin/*/x64/makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
           $msix=Join-Path $out 'Jipsa-Yeopjari-1.0.10.0-Store.msix'
           & $make pack /o /h SHA256 /d $layout /p $msix
           if($LASTEXITCODE -ne 0){throw 'MSIX validation failed'}
           & $make unpack /o /p $msix /d "$env:RUNNER_TEMP/roundtrip"
           if($LASTEXITCODE -ne 0){throw 'Roundtrip failed'}
           foreach($f in Get-ChildItem $layout -Recurse -File){
            $rel=[IO.Path]::GetRelativePath($layout,$f.FullName)
            if((Get-FileHash $f.FullName).Hash -ne (Get-FileHash (Join-Path "$env:RUNNER_TEMP/roundtrip" $rel)).Hash){throw "Roundtrip changed $rel"}
           }
           Get-FileHash $msix | Format-List | Out-File "$out/package-sha256.txt"
           @"
          # 집사 옆자리 1.0.10.0 — Cloud PC 재검사용
          
          파일: Jipsa-Yeopjari-1.0.10.0-Store.msix
          MSIX SHA256: $((Get-FileHash $msix).Hash.ToLowerInvariant())
          Actions: https://github.com/chaapssal-nooroonghi/PurrDesk/actions/runs/$env:GITHUB_RUN_ID
          Artifact: store-v110-dpi-validation
          
          실제 Cloud PC에서 1.0.9.0의 250→100% 전환 후 비활성 탭/새 설정창/메뉴 글자가 크게 남는 문제가 재현됐습니다. 1.0.10.0은 설정 글꼴을 현재 창 DPI의 픽셀 크기로 만들고, 숨겨진 탭을 포함해 갱신합니다. 실행 시점 메뉴 글꼴 복사도 제거했고 고정 크기 설정창의 배율 복원 너비를 보정했습니다.
          
          동봉 rendering 검사는 글꼴 변환 DC가 96/240 DPI인 조건, 숨겨진 탭 선택, 100/125/150/200/250% DPI 메시지, 새 설정창, 입력 보존과 버튼/행 잘림을 확인합니다. 실제 Windows 배율 전환을 대신하지 않습니다. 실제 Cloud PC 재검사와 재로그인 자동 시작 확인은 아직 필요합니다.
          
          기존 1.0.9.0 위에 업데이트 설치하세요. 원본 해시를 확인하고 복사본만 테스트 서명하세요. 기존 환경 유지 지시를 따르고 검사 시작 전 현재 상태·인증서 유효기간을 확인하세요. 사용자 데이터는 숨김 폴더까지 백업하세요.
          
          핵심 재검사: 250%에서 설정 첫 탭을 열고 이름/시간을 저장하지 않은 채 수정 → 앱 재시작 없이 100%로 변경 → 나머지 세 탭 선택 → 첫 탭 복귀 → 취소 → 우클릭 메뉴 → 새 설정창. 글꼴과 버튼 잘림, 저장 전 입력 보존을 확인하세요. 250→200→150→125→100% 및 역순, 각 배율 새 실행, 크기/뽀모도르/스트레칭 창·말풍선·클릭 통과/숨김·드래그도 이어서 확인하세요.
          
          WACK는 해당 Cloud PC 도구로 appcert.exe test -appxpackagepath <테스트서명 복사본> -reportoutputpath <wack-report.xml> 전체 검사를 사용하세요. 로그아웃/재로그인 자동 시작, 설정·사진 보존도 검사하세요. 물리적 혼합 배율 모니터를 검사하지 못하면 미검사로 표시하세요.
          
          남은 문제·경고·실패가 있으면 제출하지 마세요. 이 빌드 세션은 Store 제출을 하지 않았습니다. 기존 v1.0.5 및 Mac 배포 파일, 모델·사진은 변경하지 않았습니다. WindowsApps ACL 변경/검사 제외/결과 편집/패키지 컨텍스트 주입 없음. Store 원본에 테스트 인증서·개인키·서명을 넣지 않았습니다.
          
          다음 보고서에는 원본 MSIX 전체를 다시 넣을 필요가 없습니다. 결과 문서, WACK 원본 XML, 전후 화면, DPI 측정값만 전달하세요.
          "@ | Set-Content "$out/README.ko.md" -Encoding UTF8
           $wack=Join-Path $kits 'App Certification Kit/appcert.exe'
           if(!(Test-Path $wack)){
            $sdk=Join-Path $env:RUNNER_TEMP 'sdk.exe'
            Invoke-WebRequest 'https://download.microsoft.com/download/e6cfffdc-0d3e-4c6c-96d7-d491da459a07/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $sdk
            $sig=Get-AuthenticodeSignature $sdk;if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation'){throw 'SDK signature invalid'}
            $p=Start-Process $sdk -ArgumentList '/quiet','/norestart','/features','OptionId.WindowsSoftwareLogoToolkit' -PassThru
            if(!$p.WaitForExit(600000)){throw 'SDK timeout'}
           }
           (Get-Item $wack).VersionInfo | Format-List | Out-File "$out/wack-version.txt"
           $cert=New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=DE7DDEC8-9C61-4EC5-BFE6-81123A68DFC1' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
           $cer="$env:RUNNER_TEMP/test.cer";Export-Certificate -Cert $cert -FilePath $cer | Out-Null
           $trusted=Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
           $signed="$env:RUNNER_TEMP/test-only.msix";Copy-Item $msix $signed
           $sign=(Get-ChildItem "$kits/bin/*/x64/signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
           & $sign sign /fd SHA256 /sha1 $cert.Thumbprint $signed
           if($LASTEXITCODE -ne 0){throw 'Test signing failed'}
           & $wack reset
           $p=Start-Process $wack -ArgumentList 'test','-appxpackagepath',$signed,'-reportoutputpath',"$out/wack-report.xml" -PassThru -RedirectStandardOutput "$out/wack-stdout.txt" -RedirectStandardError "$out/wack-stderr.txt"
           if(!$p.WaitForExit(600000)){throw 'WACK timeout'}
           [xml]$report=Get-Content "$out/wack-report.xml" -Raw
           $results=@($report.SelectNodes('//TEST') | ForEach-Object { [pscustomobject]@{Id=$_.GetAttribute('INDEX');Name=$_.GetAttribute('NAME');Result=$_.SelectSingleNode('RESULT').InnerText;Messages=@($_.SelectNodes('MESSAGES/MESSAGE') | ForEach-Object {$_.GetAttribute('TEXT')})} })
           $results | ConvertTo-Json -Depth 5 | Tee-Object "$out/results.json"
           # Real Windows runtime and full settings forms; no screenshots fabricated.
           Copy-Item $layout "$env:RUNNER_TEMP/ui-check" -Recurse
           [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/ui-check/RenderingChecks.exe",[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/ui-check/RenderingChecks.exe.config",[Convert]::FromBase64String(''))
           & "$env:RUNNER_TEMP/ui-check/RenderingChecks.exe" "$out/rendering" | Tee-Object "$out/rendering-console.txt"
           $uiExit=$LASTEXITCODE
           Add-AppxPackage -Path $signed
           $package=Get-AppxPackage -Name 'Chaapssal-Nooroongghi.10202156D8DE9'
           if($package.Version -ne '1.0.10.0'){throw 'Installed version mismatch'}
           Start-Process explorer.exe -ArgumentList ('shell:AppsFolder\'+$package.PackageFamilyName+'!PurrDesk')
           Start-Sleep -Seconds 8
           $app=@(Get-Process PurrDesk -ErrorAction SilentlyContinue)
           if($app.Count -eq 0){throw 'Packaged launch did not stay alive'}
           Add-Type -TypeDefinition @'
          using System;using System.Runtime.InteropServices;using System.Collections.Generic;
          public static class WindowDpiCheck {
           delegate bool EnumProc(IntPtr h,IntPtr p);
           [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc cb,IntPtr p);
           [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h,out uint pid);
           [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
           [DllImport("user32.dll")] static extern IntPtr GetWindowDpiAwarenessContext(IntPtr h);
           [DllImport("user32.dll")] static extern bool AreDpiAwarenessContextsEqual(IntPtr a,IntPtr b);
           public static string[] Check(uint pid) {var r=new List<string>();EnumWindows((h,p)=>{uint id;GetWindowThreadProcessId(h,out id);if(id==pid && IsWindowVisible(h))r.Add("HWND="+h+";PerMonitorV2="+AreDpiAwarenessContextsEqual(GetWindowDpiAwarenessContext(h),new IntPtr(-4)));return true;},IntPtr.Zero);return r.ToArray();}
          }
          '@
           $windows=@([WindowDpiCheck]::Check($app[0].Id));$windows | Tee-Object "$out/packaged-window-dpi.txt"
           if($windows.Count -lt 2 -or @($windows | Where-Object {$_ -notmatch 'PerMonitorV2=True'}).Count){throw 'Pet windows are not both PMv2'}
           @{installed=$true;aumid_launch=$true;visible_windows=$windows.Count;window_pm_v2=$true;relogin_startup_tested=$false;rendering_checks_exit=$uiExit} | ConvertTo-Json | Set-Content "$out/runtime.json"
           $app | Stop-Process -Force
           if($uiExit -ne 0){throw 'Font pixel and inactive-tab rendering checks failed'}
           if($results.Count -ne 24 -or @($results | Where-Object {$_.Result -ne 'PASS'}).Count){throw 'Not all 24 WACK tests passed'}
          } finally {
           Get-Process PurrDesk -ErrorAction SilentlyContinue | Stop-Process -Force
           Get-AppxPackage -Name 'Chaapssal-Nooroongghi.10202156D8DE9' | Remove-AppxPackage
           if($trusted){Remove-Item ("Cert:\LocalMachine\TrustedPeople\"+$trusted.Thumbprint)}
           if($cert){Remove-Item ("Cert:\CurrentUser\My\"+$cert.Thumbprint) -DeleteKey}
           if($original){Get-FileHash $original | Format-List | Out-File "$out/original-hash-after.txt"}
           'Original 1.0.9 and all released/Mac artifacts unchanged. New unsigned candidate only. No Store submission. No ACL edits or WACK changes. Temp install/cert removed. Relogin startup and actual multi-monitor scale changes still require Cloud PC validation.' | Set-Content "$out/scope.txt"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-v110-dpi-validation
          path: candidate-output
          retention-days: 30
