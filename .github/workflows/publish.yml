name: Publish PurrDesk

on:
  push:
    paths:
      - release-manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purrdesk-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify release files
        run: python3 publish-release.py
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("release-manifest.json"))["tag"])')
          if gh release view "$tag" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != true ]; then
              echo 'This release is already public; no files were changed.'
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "집사 옆자리 $tag" --notes-file RELEASE-NOTES.md
          fi
          gh release edit "$tag" --target "$GITHUB_SHA" --title "집사 옆자리 $tag" --notes-file RELEASE-NOTES.md
          gh release upload "$tag" packages/*.zip --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\")" > uploaded-release.json
          python3 - <<'PY'
          import json
          manifest=json.load(open('release-manifest.json'))
          release=json.load(open('uploaded-release.json'))
          expected={f['name']:(f['bytes'],'sha256:'+f['sha256']) for f in manifest['files']}
          actual={f['name']:(f['size'],f['digest']) for f in release['assets']}
          assert release['draft'] and expected==actual, 'Uploaded package verification failed'
          PY
          gh release edit "$tag" --draft=false --prerelease=false --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > published-release.json
          python3 - <<'PY'
          import json
          r=json.load(open('published-release.json'))
          assert r['immutable'] and not r['draft'] and not r['prerelease']
          print('Published immutable release:',r['html_url'])
          PY
