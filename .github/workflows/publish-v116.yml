          7723,\n          \"6\"\n        ],\n        [\n          7753,\n          7754,\n          \"6\"\n        ],\n        [\n          7873,\n          7874,\n          \"6\"\n        ],\n        [\n          7907,\n          7908,\n          \"6\"\n        ],\n        [\n          7933,\n          7933,\n          \"(candidate);\\n            FourPets\"\n        ]\n      ]\n    },\n    \"RELEASE-NOTES.md\": {\n      \"before_sha256\": \"9226fca8b203f52b5bce744c453238eef4f22a9a6a7a56f323d0a9f2e086cb20\",\n      \"edits\": [\n        [\n          0,\n          8,\n          \"귀염둥이\"\n        ],\n        [\n          10,\n          12,\n          \"최대 4마리까지 동시에 띄울\"\n        ],\n        [\n          14,\n          15,\n          \"\"\n        ],\n        [\n          16,\n          66,\n          \"있\"\n        ],\n        [\n          72,\n          74,\n          \"-\"\n        ],\n        [\n          75,\n          77,\n          \"우클릭 및 트레이/메뉴 막대의 추가 메뉴가 4마리 기준으로\"\n        ],\n        [\n          80,\n          81,\n          \"됩니다.\\n-\"\n        ],\n        [\n          82,\n          84,\n          \"네\"\n        ],\n        [\n          85,\n          87,\n          \"번째 귀염둥이의 사진과 개별 설정\"\n        ],\n        [\n          89,\n          108,\n          \"저장\"\n        ],\n        [\n          114,\n          118,\n          \"불러올\"\n        ],\n        [\n          119,\n          122,\n          \"수 있습\"\n        ],\n        [\n          125,\n          125,\n          \"\\n-\"\n        ],\n        [\n          126,\n          129,\n          \"\"\n        ],\n        [\n          130,\n          130,\n          \"본 포함된 누룽지·찹쌀이\"\n        ],\n        [\n          132,\n          134,\n          \"기존\"\n        ],\n        [\n          135,\n          138,\n          \"사진·설정은\"\n        ],\n        [\n          139,\n          153,\n          \"유지됩\"\n        ],\n        [\n          165,\n          166,\n          \", Apple 칩 Mac, Intel\"\n        ],