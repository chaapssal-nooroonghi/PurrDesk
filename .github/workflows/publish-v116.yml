          "run": "python3 - <<'PYCODE'\nfrom pathlib import Path\nimport json,zipfile,hashlib,difflib\nroot=Path('assembled');root.mkdir()\nwith zipfile.ZipFile('prior/build-input.zip') as z:z.extractall(root)\npatch=json.loads(r'''{\n  \"edits\": {\n    \"PortableChecks/Program.cs\": {\n      \"before_sha256\": \"c66f20b2f7f705c15ebc12ddedeaf308e95137e8c9791ae6296b500a22fa4da5\",\n      \"edits\": [\n        [\n          4485,\n          4485,\n          \",int expected=2\"\n        ],\n        [\n          4775,\n          4776,\n          \"expected\"\n        ],\n        [\n          4800,\n          4800,\n          \"{expec\"\n        ],\n        [\n          4801,\n          4803,\n          \"ed}\"\n        ],\n        [\n          5022,\n          5022,\n          \"}\\n    static void FourPets(string folder)\\n    {\\n        string config=Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),\\\"CatDesk\\\",\\\"settings.json\\\");\\n        byte[] original=File.ReadAllBytes(config);Process? process=null;\\n        try\\n        {\\n            var a=Assembly.LoadFrom(Path.Combine(folder,\\\"data\\\",\\\"집사 옆자리.exe\\\"));var storage=a.GetType(\\\"CatDesk.Storage\\\",true)!;\\n            object roster=Call(storage,\\\"Load\\\",config,null)!;\\n            var cats=(System.Collections.IList)roster.GetType().GetProperty(\\\"Cats\\\")!.GetValue(roster)!;\\n            var add=roster.GetType().GetMethod(\\\"TryAdd\\\")!;\\n            object first=cats[0]!;add.Invoke(roster,new[]{first});object fourth=add.Invoke(roster,new[]{first})!;\\n            Check(cats.Count==4&&fourth!=null,\\\"upgraded default roster accepts the third and fourth pets\\\");\\n            if(fourth==null)throw new Exception(\\\"Fourth pet was refused\\\");\\n            var type=fourth.GetType();\\n            type.GetProperty(\\\"Name\\\")!.SetValue(fourth,\\\"네 번째 검사 귀염둥이\\\");\\n            type.GetProperty(\\\"IdleImage\\\")!.SetValue(fourth,type.Get