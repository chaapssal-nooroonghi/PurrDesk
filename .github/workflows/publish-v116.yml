ork/PurrDesk.Framework.csproj\": {\n      \"before_sha256\": \"c3dec4153d3cece7615e11b92b817635ff0b2ab094623642fefc51e2e228ed62\",\n      \"edits\": [\n        [\n          69,\n          70,\n          \"16\"\n        ],\n        [\n          101,\n          102,\n          \"16\"\n        ],\n        [\n          139,\n          140,\n          \"16\"\n        ]\n      ]\n    }\n  },\n  \"new_tests\": {\n    \"PetLimitChecks.Mac/PetLimitChecks.csproj\": \"<Project Sdk=\\\"Microsoft.NET.Sdk\\\"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><AssemblyName>PurrDesk.Mac.Checks</AssemblyName></PropertyGroup><ItemGroup><ProjectReference Include=\\\"../mac/PurrDesk.Mac/PurrDesk.Mac.csproj\\\"/><PackageReference Include=\\\"Avalonia.Headless\\\" Version=\\\"11.3.23\\\" /></ItemGroup></Project>\\n\",\n    \"PetLimitChecks.Mac/Program.cs\": \"using Avalonia;\\nusing Avalonia.Controls;\\nusing Avalonia.Controls.ApplicationLifetimes;\\nusing Avalonia.Headless;\\nusing Avalonia.Styling;\\nusing Avalonia.Themes.Fluent;\\nusing Avalonia.Threading;\\nusing System.Reflection;\\nusing CatDesk;\\nusing PurrDesk.Mac;\\n\\nclass TestApp : Application { public override void Initialize() { RequestedThemeVariant=ThemeVariant.Light; Styles.Add(new FluentTheme()); } }\\nclass Program\\n{\\n    static int failures, count;\\n    static void Check(bool ok, string label) { count++; if(!ok) failures++; Console.WriteLine((ok?\\\"PASS \\\":\\\"FAIL \\\")+label); }\\n    static object Field(object o,string name)=>o.GetType().GetField(name,BindingFlags.Instance|BindingFlags.NonPublic)!.GetValue(o)!;\\n    static ContextMenu Menu(PetWindow pet)=>(ContextMenu)typeof(PetWindow).GetMethod(\\\"BuildMenu\\\",BindingFlags.Instance|BindingFlags.NonPublic)!.Invoke(pet,null)!;\\n    static void Menus(DesktopPets owner,List<PetWindow> pets,TrayIcon tray,int n,bool enabled)\\n    {\\n        owner.UpdateMenu();\\n        var add=tray.Menu!.Items.OfType<NativeMenuItem>().Single(i=>i.Header!.StartsWith(\\\"귀염둥이 추가하기\\\"));\\n        Check(add.Header==$\\\"귀염둥이 추가하기 ({n}/4)\\\"&&add.IsEnabled==enabled,\\\"menu-bar add entry at \\\"+n);\\n        foreach(var pet in pets)\\n        {\\n            var item=Menu(pet).Items.OfType<MenuItem>().Single(i=>i.Header?.ToString()?.StartsWith(\\\"귀염둥이 추가하기\\\")==true);\\n            Check(item.Header!.ToString()==$\\\"귀염둥이 추가하기 ({n}/4)\\\"&&item.IsEnabled==enabled,\\\"pet context add entry at \\\"+n);\\n        }\\n    }\\n    static int Main()\\n    {\\n        AppBuilder.Configure<TestApp>().UseSkia().UseHeadless(new AvaloniaHeadlessPlatformOptions{UseHeadlessDrawing=false}).SetupWithoutStarting();\\n        string work=Path.Combine(Path.GetTempPath(),\\\"four-pets-\\\"+Guid.NewGuid().ToString(\\\"N\\\"));Directory.CreateDirectory(work);\\n        byte[]? config=File.Exists(MacPaths.Config)?File.ReadAllBytes(MacPaths.Config):null;\\n        var pets=new List<PetWindow>();TrayIcon? tray=null;\\n        try\\n        {\\n            string path=Path.Combine(work,\\\"settings.json\\\");var roster=Storage.Load(path,Path.Combine(AppContext.BaseDirectory,\\\"defaults\\\"));\\n            Check(roster.Cats.Count==2&&roster.Cats[0].Name==\\\"누룽지\\\"&&roster.Cats[1].Name==\\\"찹쌀이\\\",\\\"bundled roster remains the original two pets\\\");\\n            roster.TryAdd(roster.Cats[0])!.Name=\\\"셋째\\\";\\n            var owner=new DesktopPets(new ClassicDesktopStyleApplicationLifetime(),roster);\\n            pets=(List<PetWindow>)Field(owner,\\\"pets\\\");\\n            var spawn=typeof(DesktopPets).GetMethod(\\\"Spawn\\\",BindingFlags.Instance|BindingFlags.NonPublic)!;\\n            for(int i=0;i<3;i++)spawn.Invoke(owner,[roster.Cats[i],i]);\\n            tray=new TrayIcon();typeof(DesktopPets).GetField(\\\"tray\\\",BindingFlags.Instance|BindingFlags.NonPublic)!.SetValue(owner,tray);\\n            Menus(owner,pets,tray,3,true);\\n            owner.Add(roster.Cats[0]);Dispatcher.UIThread.RunJobs();\\n            foreach(var window in pets.Last().OwnedWindows.ToArray())window.Close();Dispatcher.UIThread.RunJobs();\\n            Check(owner.Count==4&&pets.All(p=>p.IsVisible),\\\"actual add action creates a fourth visible pet window\\\");\\n            Menus(owner,pets,tray,4,false);\\n            var fourth=roster.Cats[3];fourth.Name=\\\"넷째\\\";fourth.IdleImages=[roster.Cats[0].IdleImages[0]];fourth.IdleImage=fourth.IdleImages[0];fourth.Size=72;fourth.X=72;fourth.Y=100;fourth.CountdownFormat=\\\"초\\\";\\n            Storage.Save(roster,path);var restored=Storage.Load(path);\\n            Check(restored.Cats.Count==4&&restored.Cats[3].Name==\\\"넷째\\\"&&restored.Cats[3].IdleImages.SequenceEqual(fourth.IdleImages)&&restored.Cats[3].Size==72&&restored.Cats[3].X==72&&restored.Cats[3].CountdownFormat==\\\"초\\\",\\\"fourth photo, position, size and timer format survive save/load\\\");\\n            owner.Add(roster.Cats[0]);Check(owner.Count==4&&roster.Cats.Count==4,\\\"actual add action refuses a fifth pet\\\");\\n            var second=restored.Cats[1];Check(restored.TryRemove(second)&&restored.Cats.Count==3&&restored.Cats[2].Name==\\\"넷째\\\",\\\"deleting a middle profile preserves the fourth\\\");\\n            Check(restored.TryAdd(restored.Cats[0])!=null&&restored.Cats.Count==4,\\\"deleted slot can be reused\\\");\\n            var replacement=new Preferences{Name=\\\"바꾼 첫째\\\"};var snapshot=roster.Replacing(roster.Cats[0],replacement);\\n            Check(snapshot.Cats.Count==4&&ReferenceEquals(snapshot.Cats[3],fourth)&&!ReferenceEquals(snapshot.Cats[0],roster.Cats[0]),\\\"saving one pet preserves the other three profiles\\\");\\n        }\\n        catch(Exception e){failures++;Console.WriteLine(\\\"ERROR \\\"+e);}\\n        finally\\n        {\\n            foreach(var pet in pets){foreach(var w in pet.OwnedWindows.ToArray())w.Close();pet.DisposePet();pet.Close();}tray?.Dispose();\\n            if(config!=null)File.WriteAllBytes(MacPaths.Config,config);else File.Delete(MacPaths.Config);\\n            Directory.Delete(work,true);\\n        }\\n        Console.WriteLine($\\\"CHECKS={count}\\\\nFAILURES={failures}\\\");return failures==0?0:1;\\n    }\\n}\\n\"\n  }\n}''')\nchanges=[]\nfor name,item in patch['edits'].items():\n p=root/name;raw=p.read_bytes();assert hashlib.sha256(raw).hexdigest()==item['before_sha256'],'Unexpected prior source: '+name\n before=raw.decode();after=before\n for start,end,replacement in reversed(item['edits']):after=after[:start]+replacement+after[end:]\n changes.extend(difflib.unified_diff(before.splitlines(True),after.splitlines(True),fromfile='a/'+name,tofile='b/'+name))\n p.write_text(after,encoding='utf-8')\nfor name,text in patch['new_tests'].items():\n p=root/name;assert not p.exists();p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')\n changes.extend(difflib.unified_diff([],text.splitlines(True),fromfile='/dev/null',tofile='b/'+name))\n(root/'changes.patch').write_text(''.join(changes),encoding='utf-8')\nwith zipfile.ZipFile('build-input.zip','w',zipfile.ZIP_DEFLATED,9) as z:\n for p in sorted(root.rglob('*')):\n  if p.is_file() and not set(p.relative_to(root).parts)&{'bin','obj'}:z.write(p,p.relative_to(root))\nprint('Input SHA256:',hashlib.sha256(Path('build-input.zip').read_bytes()).hexdigest())\nPYCODE\n"
