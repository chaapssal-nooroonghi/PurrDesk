(json.dumps(m,indent=2))\nPath('packages/SHA256SUMS.txt').write_text(''.join(f['sha256']+'  '+f['name']+chr(10) for f in m['files']))\nPath('evidence/validation.json').write_text(json.dumps({'passed':True,'windows_native':True,'mac_arm64_native':False,'mac_arm64_cross_build_verified':True,'mac_intel_native':True,'actual_scale_transitions':False,'store_submission':False},indent=2))\nshutil.copyfile('packages/release-manifest.json','evidence/release-manifest.json')\nPYCODE\npython3 publish_verified.py\n"
