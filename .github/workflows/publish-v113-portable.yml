name: Publish portable Windows 1.0.13 and unchanged Mac packages
on:
  push:
    paths: ['.github/workflows/publish-v113-portable.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: purrdesk-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Verify inputs, package portable app and test real launcher
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          function Write-CompressedFile($path, $encoded) {
            $inputStream=[IO.MemoryStream]::new([Convert]::FromBase64String($encoded))
            $decompress=[IO.Compression.GZipStream]::new($inputStream,[IO.Compression.CompressionMode]::Decompress)
            $outputStream=[IO.MemoryStream]::new()
            try { $decompress.CopyTo($outputStream); [IO.File]::WriteAllBytes($path,$outputStream.ToArray()) }
            finally { $outputStream.Dispose(); $decompress.Dispose(); $inputStream.Dispose() }
          }
          New-Item -Type Directory old,inputs,packages,evidence | Out-Null
          gh release download v1.0.5 --repo $env:GITHUB_REPOSITORY --dir old --pattern '*.zip'
          if($LASTEXITCODE -ne 0){throw 'Original release download failed'}
          gh api repos/chaapssal-nooroonghi/PurrDesk/actions/artifacts/14155980826/zip > store-validation.zip
          if($LASTEXITCODE -ne 0){throw 'Validated candidate download failed'}
          if((Get-FileHash store-validation.zip).Hash.ToLowerInvariant() -ne '2f8106eaee489a44e9eef388cf9deb1592c6426daa9cf3ce1d7cbe9c22cfcef3'){throw 'Candidate artifact hash mismatch'}
          Expand-Archive store-validation.zip inputs/store
          Write-CompressedFile "$pwd/package_portable.py" ''
          Write-CompressedFile "$pwd/publish_verified.py" ''
          Write-CompressedFile "$pwd/RELEASE-NOTES.md" ''
          Write-CompressedFile "$pwd/inputs/launcher.exe" ''
          Write-CompressedFile "$pwd/inputs/PortableChecks.exe" ''
          $msix=(Get-ChildItem inputs/store -Recurse -Filter Jipsa-Yeopjari-1.0.13.0-Store.msix).FullName
          python package_portable.py old $msix inputs/launcher.exe packages
          if($LASTEXITCODE -ne 0){throw 'Packaging invariants failed'}
          Copy-Item packages/release-manifest.json,packages/SHA256SUMS.txt,RELEASE-NOTES.md evidence
          Expand-Archive old/Jipsa-Yeopjari-Windows.zip baseline
          Expand-Archive packages/Jipsa-Yeopjari-Windows.zip portable
          $shell=New-Object -ComObject WScript.Shell
          $shortcut=$shell.CreateShortcut("$pwd/portable/집사 옆자리 바로가기.lnk")
          "Original shortcut target: $($shortcut.TargetPath)" | Out-File evidence/shortcut.txt
          $shortcut.TargetPath="$pwd/portable/집사 옆자리.exe"
          $shortcut.WorkingDirectory='.'
          $shortcut.Description='집사 옆자리'
          $shortcut.Save()
          # Validate relocation: the shortcut's original absolute target no longer exists.
          Move-Item portable relocated
          Copy-Item inputs/PortableChecks.exe relocated/data
          Copy-Item 'relocated/data/집사 옆자리.exe.config' relocated/data/PortableChecks.exe.config
          & ./relocated/data/PortableChecks.exe "$pwd/baseline" "$pwd/relocated" "$pwd/evidence/portable-checks.txt"
          if($LASTEXITCODE -ne 0){throw 'Portable launcher/startup/data regression failed; release not published'}
          @'
          from pathlib import Path
          import zipfile,json,hashlib
          path=Path('packages/Jipsa-Yeopjari-Windows.zip')
          with zipfile.ZipFile(path) as z: entries=[(i,z.read(i)) for i in z.infolist()]
          link=Path('relocated/집사 옆자리 바로가기.lnk').read_bytes()
          with zipfile.ZipFile(path,'w') as z:
              for info,data in entries: z.writestr(info,link if info.filename=='집사 옆자리 바로가기.lnk' else data,compresslevel=9)
          m=json.loads(Path('packages/release-manifest.json').read_text(encoding='utf-8'))
          m['changed_windows_entries'].append('집사 옆자리 바로가기.lnk')
          for f in m['files']:
              p=Path('packages')/f['name'];f['bytes']=p.stat().st_size;f['sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('packages/release-manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('packages/SHA256SUMS.txt').write_text(''.join(f"{f['sha256']}  {f['name']}"+chr(10) for f in m['files']),encoding='utf-8')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Final shortcut packaging failed'}
          Copy-Item packages/release-manifest.json,packages/SHA256SUMS.txt evidence -Force
          $manifest=Get-Content packages/release-manifest.json -Raw | ConvertFrom-Json
          foreach($f in $manifest.files){if((Get-FileHash (Join-Path packages $f.name)).Hash.ToLowerInvariant() -ne $f.sha256){throw 'Package mutated during tests'}}
      - name: Upload verified assets and publish immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python publish_verified.py
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-v113-evidence
          path: evidence
          retention-days: 90
