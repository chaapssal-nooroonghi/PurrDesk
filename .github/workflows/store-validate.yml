name: Validate Microsoft Store package
on:
  push:
    paths:
      - store-build-request.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified compiled binaries (no application source)
        shell: python
        run: |
          import json, hashlib, subprocess, urllib.parse, zipfile
          from html.parser import HTMLParser
          from pathlib import Path
          r=json.loads(Path('store-build-request.json').read_text(encoding='utf-8'))
          u=urllib.parse.urlparse(r['url'])
          assert u.scheme=='https' and u.hostname=='tmpfiles.org'
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and 'download' in a.get('class','').split(): self.urls.append(a['href'])
          page=subprocess.run(['curl.exe','--fail','--silent','--show-error',r['url']],capture_output=True,text=True,check=True).stdout
          links=Links();links.feed(page);assert len(links.urls)==1
          direct=urllib.parse.urljoin(r['url'],links.urls[0]);u=urllib.parse.urlparse(direct)
          assert u.scheme=='https' and u.hostname=='tmpfiles.org' and u.path.startswith('/dl/')
          subprocess.run(['curl.exe','--fail','--silent','--show-error','--max-time','180','--output','store-binaries.zip',direct],check=True)
          data=Path('store-binaries.zip').read_bytes();assert len(data)==r['bytes'] and hashlib.sha256(data).hexdigest()==r['sha256']
          with zipfile.ZipFile('store-binaries.zip') as z:
              assert z.testzip() is None
              z.extractall('input')
      - name: Build and validate MSIX with Microsoft MakeAppx
        shell: pwsh
        run: ./store-tools/build.ps1 -Preview -Prebuilt "$env:GITHUB_WORKSPACE/input/payload" -Output "$env:GITHUB_WORKSPACE/store-output"
      - name: Run Windows functional checks
        shell: pwsh
        run: |
          Copy-Item ./store-output/layout ./checks -Recurse -Force
          Copy-Item ./input/checks/* ./checks -Force
          & ./checks/PurrDesk.Framework.Checks.exe | Tee-Object ./store-output/windows-checks.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows checks failed' }
      - name: Run native desktop smoke check
        shell: pwsh
        run: ./store-tools/smoke.ps1 -Layout "$env:GITHUB_WORKSPACE/store-output/layout" -Output "$env:GITHUB_WORKSPACE/store-output"
      - name: Save package and verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-preview-validation
          path: |
            store-output/*.msix
            store-output/*.json
            store-output/*.png
            store-output/*.txt
          if-no-files-found: warn
          retention-days: 30
