name: Reproduce and verify save, brush and photo bugs
on:
  push:
    paths: ['.github/workflows/interaction-bugs-compare.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Run identical behavior checks on old and corrected source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          function Write-CompressedFile($path, $encoded) {
            $inputStream=[IO.MemoryStream]::new([Convert]::FromBase64String($encoded))
            $decompress=[IO.Compression.GZipStream]::new($inputStream,[IO.Compression.CompressionMode]::Decompress)
            $outputStream=[IO.MemoryStream]::new()
            try { $decompress.CopyTo($outputStream); [IO.File]::WriteAllBytes($path,$outputStream.ToArray()) }
            finally { $outputStream.Dispose(); $decompress.Dispose(); $inputStream.Dispose() }
          }
          gh api repos/chaapssal-nooroonghi/PurrDesk/actions/artifacts/14152280344/zip > original.zip
          if($LASTEXITCODE -ne 0){throw 'Download failed'}
          Expand-Archive original.zip original
          $original=(Get-ChildItem original -Recurse -Filter Jipsa-Yeopjari-1.0.11.0-Store.msix).FullName
          if((Get-FileHash $original).Hash.ToLowerInvariant() -ne '45d18ac588636d4c7f1522736f22c76f39552de3defff58e0be9780e7f6a6ca0'){throw 'Wrong original'}
          [IO.Compression.ZipFile]::ExtractToDirectory($original,"$pwd/baseline")
          Copy-Item baseline candidate -Recurse
          New-Item -Type Directory output | Out-Null
          Write-CompressedFile "$pwd/baseline/BugChecks.exe" ''
          Write-CompressedFile "$pwd/baseline/BugChecks.exe.config" ''
          Write-CompressedFile "$pwd/baseline/orientation6.jpg" ''
          Write-CompressedFile "$pwd/candidate/BugChecks.exe" ''
          Write-CompressedFile "$pwd/candidate/BugChecks.exe.config" ''
          Write-CompressedFile "$pwd/candidate/orientation6.jpg" ''
          & ./baseline/BugChecks.exe "$pwd/output/baseline" | Tee-Object output/baseline-console.txt
          $before=$LASTEXITCODE
          & ./candidate/BugChecks.exe "$pwd/output/candidate" | Tee-Object output/candidate-console.txt
          $after=$LASTEXITCODE
          @{baseline_exit=$before;candidate_exit=$after;startup_api_test_double=$true;actual_monitor_switch=$false} | ConvertTo-Json | Set-Content output/comparison.json
          if($before -eq 0){throw 'No baseline failures detected'}
          if(!(Test-Path output/baseline/bugs.txt) -or (Select-String '^ERROR ' output/baseline/bugs.txt)){throw 'Baseline fixture failed'}
          if($after -ne 0){throw 'Candidate behavior checks failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interaction-bug-comparison
          path: output
          retention-days: 14
