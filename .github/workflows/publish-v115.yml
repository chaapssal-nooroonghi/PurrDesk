{
  "name": "Build test and release chatter 1.0.15",
  "on": {
    "push": {
      "paths": [
        ".github/workflows/publish-v115.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "purrdesk-release",
    "cancel-in-progress": false
  },
  "jobs": {
    "input": {
      "runs-on": "ubuntu-latest",
      "env": {
        "GH_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "mac-v114-build-input",
            "run-id": 43710270505,
            "github-token": "${{ github.token }}",
            "path": "prior"
          }
        },
        {
          "name": "Assemble source from GitHub artifact and reviewed changes",
          "run": "set -euo pipefail\necho '14c71382d1b6f69395c0d4c08afa0c0fae79a8aedc3ae3cb2c19bdfc3efbb201  prior/build-input.zip' | sha256sum --check\ngh release download v1.0.14 --repo \"$GITHUB_REPOSITORY\" --pattern Jipsa-Yeopjari-Windows.zip --dir prior-windows\npython3 - <<'PYCODE'\nfrom pathlib import Path\nimport zipfile,hashlib,json,gzip,base64,shutil\nroot=Path('assembled');root.mkdir()\nwith zipfile.ZipFile('prior/build-input.zip') as z:z.extractall(root)\n(root/'source').rename(root/'mac')\nfiles=json.loads(gzip.decompress(base64.b64decode('')))\nfor name,text in files.items():\n p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')\np=Path('prior-windows/Jipsa-Yeopjari-Windows.zip');assert hashlib.sha256(p.read_bytes()).hexdigest()=='482150b36c25e2b01f481a4f58606f6d3f32a233168fea4ea3ea59560ed8cd15'\nwith zipfile.ZipFile(p) as z:\n for name in z.namelist():\n  if any(name.startswith('data/'+part+'/') for part in ['defaults','fonts','models','licenses']):\n   dest=root/'windows/CatDesk'/name.removeprefix('data/');dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(z.read(name))\nwith zipfile.ZipFile('build-input.zip','w',zipfile.ZIP_DEFLATED,9) as z:\n for p in sorted(root.rglob('*')):\n  if p.is_file() and not set(p.relative_to(root).parts)&{'bin','obj'}:z.write(p,p.relative_to(root))\nprint('Assembled source SHA256:',hashlib.sha256(Path('build-input.zip').read_bytes()).hexdigest())\nPYCODE\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "v115-build-input",
            "path": "build-input.zip",
            "retention-days": 90
          }
        }
      ]
    },
    "mac": {
      "needs": "input",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "rid": "osx-arm64",
              "runner": "macos-15",
              "asset": "Jipsa-Yeopjari-Mac-AppleSilicon.zip",
              "cpu": "0x100000c"
            },
            {
              "rid": "osx-x64",
              "runner": "macos-15-intel",
              "asset": "Jipsa-Yeopjari-Mac-Intel.zip",
              "cpu": "0x1000007"
            }
          ]
        }
      },
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 25,
      "env": {
        "PYTHONUTF8": "1",
        "PURRDESK_TEST_ARTIFACTS": "${{ github.workspace }}/evidence/basic-artifacts"
      },
      "steps": [
        {
          "uses": "actions/setup-dotnet@v4",
          "with": {
            "dotnet-version": "10.0.404"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "v115-build-input"
          }
        },
        {
          "name": "Extract verified source snapshot",
          "run": "python3 -m zipfile -e build-input.zip .\nmkdir -p evidence packages\ncp changes.patch RELEASE-NOTES.md evidence/\nsw_vers > evidence/build-environment.txt\nuname -m >> evidence/build-environment.txt\ndotnet --info >> evidence/build-environment.txt\n"
        },
        {
          "name": "Test Mac image and settings paths",
          "run": "set -o pipefail\ndotnet run --project mac/PurrDesk.Mac.Checks -c Release | tee evidence/basic-checks.log\ndotnet run --project RegressionChecks -c Release | tee evidence/regression-checks.log\ncp regression-results.json evidence/\npython3 - <<'PYCODE'\nimport json\nassert json.load(open('regression-results.json'))['failures']==0\nassert '34 mac checks passed.' in open('evidence/basic-checks.log').read()\nPYCODE\n\ndotnet run --project ChatterChecks.Mac -c Release | tee evidence/chatter-checks.log\ngrep -q \"FAILURES=0\" evidence/chatter-checks.log\n"
        },
        {
          "name": "Build and sign native architecture bundle",
          "env": {
            "RID": "${{ matrix.rid }}",
            "ASSET": "${{ matrix.asset }}",
            "CPU": "${{ matrix.cpu }}"
          },
          "run": "set -o pipefail\ndotnet publish mac/PurrDesk.Mac/PurrDesk.Mac.csproj -c Release -r \"$RID\" --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish | tee evidence/publish.log\npython3 mac/PurrDesk.Mac/package.py --rid \"$RID\" --publish publish --output packaged | tee evidence/package.log\ncodesign --verify --deep --strict 'packaged/집사 옆자리.app' 2> evidence/codesign-verify.txt\npython3 mac/PurrDesk.Mac/verify_bundle.py 'packaged/집사 옆자리.app' \"$CPU\" > evidence/bundle-verification.json\nPYTHONPATH=mac/PurrDesk.Mac python3 - <<'PYCODE'\nfrom pathlib import Path\nfrom verify_bundle import verify_single_file\nimport plistlib,hashlib,json\ncount=verify_single_file(Path('publish/PurrDesk'),Path('packaged/집사 옆자리.app/Contents/MacOS/PurrDesk'))\np=plistlib.loads(Path('packaged/집사 옆자리.app/Contents/Info.plist').read_bytes());assert p['CFBundleShortVersionString']=='1.0.15'\nprint('Verified unchanged .NET payloads after signing:',count)\nPYCODE\nmv packaged.zip \"packages/$ASSET\"\ncp packaged.json evidence/package.json\n"
        },
        {
          "name": "Start packaged app and observe native pet windows",
          "run": "cp NativeWindows.swift native_smoke.py evidence/\nswiftc NativeWindows.swift -o native-windows\npython3 native_smoke.py \"packaged/집사 옆자리.app\" evidence\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "v115-${{ matrix.rid }}",
            "path": "packages\nevidence\n",
            "retention-days": 90
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "failure()",
          "with": {
            "name": "v115-failure-${{ matrix.rid }}",
            "path": "evidence"
          }
        }
      ]
    },
    "windows": {
      "needs": "input",
      "runs-on": "windows-latest",
      "timeout-minutes": 20,
      "env": {
        "PYTHONUTF8": "1",
        "GH_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/setup-dotnet@v4",
          "with": {
            "dotnet-version": "10.0.404"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "v115-build-input"
          }
        },
        {
          "name": "Build Windows application and regression checks",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\npython -m zipfile -e build-input.zip .\nNew-Item -ItemType Directory -Force evidence,packages | Out-Null\nCopy-Item changes.patch,RELEASE-NOTES.md evidence\nfunction CheckExit { if ($LASTEXITCODE -ne 0) { throw \"Command failed: $LASTEXITCODE\" } }\ndotnet build windows/PurrDesk.Framework -c Release -p:AssemblyName=PurrDesk -p:Version=1.0.15 -p:AssemblyVersion=1.0.15.0 -p:FileVersion=1.0.15.0 -o build/main | Tee-Object evidence/windows-build.log\nCheckExit\ndotnet build windows/Launcher -c Release -o build/launcher\nCheckExit\ndotnet run --project windows/PurrDesk.Framework.Checks -c Release | Tee-Object evidence/basic-checks.log\nCheckExit\ndotnet build PortableChecks -c Release -o build/portable\nCheckExit\ndotnet build ChatterChecks.Windows -c Release -o build/chatter\nCheckExit\n"
        },
        {
          "name": "Package preserving dependencies resources and working shortcut",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\ngh release download v1.0.14 --repo \"$env:GITHUB_REPOSITORY\" --pattern Jipsa-Yeopjari-Windows.zip --dir baseline-zip\nif ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }\n@'\nfrom pathlib import Path\nimport zipfile,hashlib,shutil,json\np=Path('baseline-zip/Jipsa-Yeopjari-Windows.zip');assert hashlib.sha256(p.read_bytes()).hexdigest()=='482150b36c25e2b01f481a4f58606f6d3f32a233168fea4ea3ea59560ed8cd15'\nwith zipfile.ZipFile(p) as z:z.extractall('baseline');z.extractall('candidate')\nshutil.copyfile('build/main/PurrDesk.exe','candidate/data/집사 옆자리.exe')\nshutil.copyfile('build/main/PurrDesk.exe.config','candidate/data/집사 옆자리.exe.config')\nshutil.copyfile('build/launcher/집사 옆자리.exe','candidate/집사 옆자리.exe')\nchanged=[]\nfor f in Path('candidate').rglob('*'):\n if f.is_file() and f.read_bytes()!=(Path('baseline')/f.relative_to('candidate')).read_bytes():changed.append(str(f.relative_to('candidate')).replace('\\\\','/'))\nassert set(changed)<=set(['집사 옆자리.exe','data/집사 옆자리.exe','data/집사 옆자리.exe.config']),changed\nwith zipfile.ZipFile('packages/Jipsa-Yeopjari-Windows.zip','w',zipfile.ZIP_DEFLATED,9) as z:\n for f in sorted(Path('candidate').rglob('*')):\n  if f.is_file():z.write(f,f.relative_to('candidate'))\nPath('evidence/windows-resource-preservation.json').write_text(json.dumps({'changed':changed,'other_files_identical':True},ensure_ascii=False,indent=2),encoding='utf-8')\n\n'@ | Set-Content -Encoding utf8 package_windows.py\npython package_windows.py\nif ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }\n"
        },
        {
          "name": "Verify native portable startup and actual pet chatter state",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\n& ./build/portable/PortableChecks.exe baseline candidate evidence/portable-checks.txt\nif ($LASTEXITCODE -ne 0) { throw 'Portable regression failed' }\nCopy-Item build/chatter/ChatterChecks.exe candidate/data/\nCopy-Item build/chatter/ChatterChecks.exe.config candidate/data/ -ErrorAction SilentlyContinue\n& './candidate/data/ChatterChecks.exe' | Tee-Object evidence/chatter-checks.log\nif ($LASTEXITCODE -ne 0) { throw 'Chatter regression failed' }\nif (-not (Select-String -Quiet -Path evidence/chatter-checks.log -Pattern 'FAILURES=0')) { throw 'Chatter result missing' }\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "v115-windows",
            "path": "packages\nevidence",
            "retention-days": 90
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "failure()",
          "with": {
            "name": "v115-windows-failure",
            "path": "evidence"
          }
        }
      ]
    },
    "publish": {
      "needs": [
        "mac",
        "windows"
      ],
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "v115-build-input",
            "path": "source-input"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "pattern": "v115-*",
            "path": "verified"
          }
        },
        {
          "name": "Verify all native builds and publish immutable release",
          "run": "set -euo pipefail\npython3 -m zipfile -e source-input/build-input.zip build-source\ncp build-source/publish_verified.py build-source/RELEASE-NOTES.md .\nmkdir -p packages evidence\npython3 - <<'PYCODE'\nfrom pathlib import Path\nimport json,hashlib,shutil\nfor rid,asset in [('windows','Jipsa-Yeopjari-Windows.zip'),('osx-arm64','Jipsa-Yeopjari-Mac-AppleSilicon.zip'),('osx-x64','Jipsa-Yeopjari-Mac-Intel.zip')]:\n d=Path('verified')/('v115-'+rid);assert 'FAILURES=0' in (d/'evidence/chatter-checks.log').read_text(encoding='utf-8-sig')\n if rid=='windows':assert 'FAILURES=0' in (d/'evidence/portable-checks.txt').read_text(encoding='utf-8-sig')\n else:\n  r=json.loads((d/'evidence/regression-results.json').read_text());assert r['failures']==0\n  n=json.loads((d/'evidence/native-smoke.json').read_text());assert n['native_app_started'] and n['visible_pet_windows']>=2\n  assert n['cpu']==('arm64' if rid=='osx-arm64' else 'x86_64')\n shutil.copyfile(d/'packages'/asset,Path('packages')/asset);shutil.copytree(d/'evidence',Path('evidence')/rid)\nm={'tag':'v1.0.15','windows_version':'1.0.15','mac_version':'1.0.15','files':[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(Path('packages').glob('*.zip'))]}\nPath('packages/release-manifest.json').write_text(json.dumps(m,indent=2))\nPath('packages/SHA256SUMS.txt').write_text(''.join(f['sha256']+'  '+f['name']+chr(10) for f in m['files']))\nPath('evidence/validation.json').write_text(json.dumps({'passed':True,'windows_native':True,'mac_arm64_native':True,'mac_intel_native':True,'actual_scale_transitions':False,'store_submission':False},indent=2))\nshutil.copyfile('packages/release-manifest.json','evidence/release-manifest.json')\nPYCODE\npython3 publish_verified.py\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "release-v115-evidence",
            "path": "evidence",
            "retention-days": 90
          }
        }
      ]
    }
  }
}