{
  "name": "Build test and release chatter 1.0.15",
  "on": {
    "push": {
      "paths": [
        ".github/workflows/publish-v115.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "purrdesk-release",
    "cancel-in-progress": false
  },
  "jobs": {
    "input": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "v115-build-input",
            "run-id": 43804449185,
            "github-token": "${{ github.token }}"
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "v115-build-input",
            "path": "build-input.zip",
            "retention-days": 90
          }
        }
      ]
    },
    "mac": {
      "needs": "input",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "rid": [
            "osx-arm64",
            "osx-x64"
          ]
        }
      },
      "timeout-minutes": 10,
      "env": {
        "GH_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "name": "Require both unchanged native Mac builds to pass",
          "run": "python3 - <<'PYCODE'\nimport subprocess,json,time,os\nfor _ in range(30):\n jobs=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/43804449185/jobs']))['jobs']\n mac=[j for j in jobs if j['name'].startswith('mac (')];assert len(mac)==2\n assert all(j['conclusion'] in [None,'success'] for j in mac),'Native Mac build failed'\n if all(j['conclusion']=='success' for j in mac):break\n time.sleep(15)\nelse:raise RuntimeError('Native Mac checks did not finish')\nprint('Reusing identical native Mac builds and their raw results from run 43804449185')\nPYCODE\n"
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "v115-${{ matrix.rid }}",
            "run-id": 43804449185,
            "github-token": "${{ github.token }}",
            "path": "native-result"
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "v115-${{ matrix.rid }}",
            "path": "native-result",
            "retention-days": 90
          }
        }
      ]
    },
    "windows": {
      "needs": "input",
      "runs-on": "windows-latest",
      "timeout-minutes": 20,
      "env": {
        "PYTHONUTF8": "1",
        "GH_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/setup-dotnet@v4",
          "with": {
            "dotnet-version": "10.0.404"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "v115-build-input"
          }
        },
        {
          "name": "Build Windows application and regression checks",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\npython -m zipfile -e build-input.zip .\nNew-Item -ItemType Directory -Force evidence,packages | Out-Null\nCopy-Item changes.patch,RELEASE-NOTES.md evidence\nfunction CheckExit { if ($LASTEXITCODE -ne 0) { throw \"Command failed: $LASTEXITCODE\" } }\ndotnet build windows/PurrDesk.Framework -c Release -p:AssemblyName=PurrDesk -p:Version=1.0.15 -p:AssemblyVersion=1.0.15.0 -p:FileVersion=1.0.15.0 -o build/main | Tee-Object evidence/windows-build.log\nCheckExit\ndotnet build windows/Launcher -c Release -o build/launcher\nCheckExit\ndotnet build windows/PurrDesk.Framework.Checks -c Release -o build/core\nCheckExit\nCopy-Item build/main/onnxruntime*.dll build/core/\n& ./build/core/PurrDesk.Framework.Checks.exe | Tee-Object evidence/basic-checks.log\nCheckExit\ndotnet build PortableChecks -c Release -o build/portable\nCheckExit\ndotnet build ChatterChecks.Windows -c Release -o build/chatter\nCheckExit\n"
        },
        {
          "name": "Package preserving dependencies resources and working shortcut",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\ngh release download v1.0.14 --repo \"$env:GITHUB_REPOSITORY\" --pattern Jipsa-Yeopjari-Windows.zip --dir baseline-zip\nif ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }\n@'\nfrom pathlib import Path\nimport zipfile,hashlib,shutil,json,struct\np=Path('baseline-zip/Jipsa-Yeopjari-Windows.zip');assert hashlib.sha256(p.read_bytes()).hexdigest()=='482150b36c25e2b01f481a4f58606f6d3f32a233168fea4ea3ea59560ed8cd15'\nwith zipfile.ZipFile(p) as z:z.extractall('baseline');z.extractall('candidate')\nshutil.copyfile('build/main/PurrDesk.exe','candidate/data/집사 옆자리.exe')\nshutil.copyfile('build/main/PurrDesk.exe.config','candidate/data/집사 옆자리.exe.config')\nshutil.copyfile('build/launcher/집사 옆자리.exe','candidate/집사 옆자리.exe')\n# Follow Microsoft's relative-link guidance: disable volume information and tracking,\n# while retaining the target ID list needed for Shell file-type association.\n# https://devblogs.microsoft.com/oldnewthing/20171019-00/?p=97247\nlink=Path('candidate/집사 옆자리 바로가기.lnk');data=link.read_bytes()\nheader=bytearray(data[:76]);flags=struct.unpack_from('<I',header,20)[0]\nassert flags==0x8f\nstruct.pack_into('<I',header,20,(flags & ~2) | 0x40100)\ni=76;id_length=struct.unpack_from('<H',data,i)[0]+2;target=data[i:i+id_length];i+=id_length\ni+=struct.unpack_from('<I',data,i)[0];start=i\nfor bit in [4,8,16,32,64]:\n if flags & bit:i+=2+2*struct.unpack_from('<H',data,i)[0]\nlink.write_bytes(header+target+data[start:i]+bytes(4))\nchanged=[]\nfor f in Path('candidate').rglob('*'):\n if f.is_file() and f.read_bytes()!=(Path('baseline')/f.relative_to('candidate')).read_bytes():changed.append(str(f.relative_to('candidate')).replace('\\\\','/'))\nassert set(changed)<=set(['집사 옆자리.exe','집사 옆자리 바로가기.lnk','data/집사 옆자리.exe','data/집사 옆자리.exe.config']),changed\nwith zipfile.ZipFile('packages/Jipsa-Yeopjari-Windows.zip','w',zipfile.ZIP_DEFLATED,9) as z:\n for f in sorted(Path('candidate').rglob('*')):\n  if f.is_file():z.write(f,f.relative_to('candidate'))\nPath('evidence/windows-resource-preservation.json').write_text(json.dumps({'changed':changed,'other_files_identical':True},ensure_ascii=False,indent=2),encoding='utf-8')\n\n'@ | Set-Content -Encoding utf8 package_windows.py\npython package_windows.py\nif ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }\n"
        },
        {
          "name": "Verify native portable startup and actual pet chatter state",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\n# Load the test harness beside the actual app so dependency resolution matches it.\nCopy-Item build/portable/PortableChecks.exe candidate/data/\nCopy-Item 'candidate/data/집사 옆자리.exe.config' candidate/data/PortableChecks.exe.config\n& ./candidate/data/PortableChecks.exe baseline candidate evidence/portable-checks.txt\nif ($LASTEXITCODE -ne 0) { throw 'Portable regression failed' }\nCopy-Item build/chatter/ChatterChecks.exe candidate/data/\nCopy-Item 'candidate/data/집사 옆자리.exe.config' candidate/data/ChatterChecks.exe.config\n& './candidate/data/ChatterChecks.exe' | Tee-Object evidence/chatter-checks.log\nif ($LASTEXITCODE -ne 0) { throw 'Chatter regression failed' }\nif (-not (Select-String -Quiet -Path evidence/chatter-checks.log -Pattern 'FAILURES=0')) { throw 'Chatter result missing' }\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "v115-windows",
            "path": "packages\nevidence",
            "retention-days": 90
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "failure()",
          "with": {
            "name": "v115-windows-failure",
            "path": "evidence"
          }
        }
      ]
    },
    "publish": {
      "needs": [
        "mac",
        "windows"
      ],
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "v115-build-input",
            "path": "source-input"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "pattern": "v115-*",
            "path": "verified"
          }
        },
        {
          "name": "Verify all native builds and publish immutable release",
          "run": "set -euo pipefail\npython3 -m zipfile -e source-input/build-input.zip build-source\ncp build-source/publish_verified.py build-source/RELEASE-NOTES.md .\nmkdir -p packages evidence\npython3 - <<'PYCODE'\nfrom pathlib import Path\nimport json,hashlib,shutil\nfor rid,asset in [('windows','Jipsa-Yeopjari-Windows.zip'),('osx-arm64','Jipsa-Yeopjari-Mac-AppleSilicon.zip'),('osx-x64','Jipsa-Yeopjari-Mac-Intel.zip')]:\n d=Path('verified')/('v115-'+rid);assert 'FAILURES=0' in (d/'evidence/chatter-checks.log').read_text(encoding='utf-8-sig')\n if rid=='windows':assert 'FAILURES=0' in (d/'evidence/portable-checks.txt').read_text(encoding='utf-8-sig')\n else:\n  r=json.loads((d/'evidence/regression-results.json').read_text());assert r['failures']==0\n  n=json.loads((d/'evidence/native-smoke.json').read_text());assert n['native_app_started'] and n['visible_pet_windows']>=2\n  assert n['cpu']==('arm64' if rid=='osx-arm64' else 'x86_64')\n shutil.copyfile(d/'packages'/asset,Path('packages')/asset);shutil.copytree(d/'evidence',Path('evidence')/rid)\nm={'tag':'v1.0.15','windows_version':'1.0.15','mac_version':'1.0.15','files':[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(Path('packages').glob('*.zip'))]}\nPath('packages/release-manifest.json').write_text(json.dumps(m,indent=2))\nPath('packages/SHA256SUMS.txt').write_text(''.join(f['sha256']+'  '+f['name']+chr(10) for f in m['files']))\nPath('evidence/validation.json').write_text(json.dumps({'passed':True,'windows_native':True,'mac_arm64_native':True,'mac_intel_native':True,'actual_scale_transitions':False,'store_submission':False},indent=2))\nshutil.copyfile('packages/release-manifest.json','evidence/release-manifest.json')\nPYCODE\npython3 publish_verified.py\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "release-v115-evidence",
            "path": "evidence",
            "retention-days": 90
          }
        }
      ]
    }
  }
}